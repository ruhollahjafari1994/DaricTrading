services:
  daric-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Logging__LogLevel__Default: Information
      Persistence__Provider: PostgreSql
      ConnectionStrings__Trading: Host=postgres;Port=5432;Database=daric;Username=daric;Password=daric_local_only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 25s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daric
      POSTGRES_USER: daric
      POSTGRES_PASSWORD: daric_local_only
    volumes:
      - daric-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daric -d daric"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  daric-postgres-data:
